version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      SECRET_KEY: dev-secret-change-me
      JWT_SECRET_KEY: dev-jwt-secret-change-me
      DATABASE_URL: sqlite:////app/graniteinfy.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5001/api
    depends_on:
      - backend

volumes:
  backend_data:
